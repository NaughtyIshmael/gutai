name: "GUTAI - Github Unit Test powered by AI"
description: "Automatically identify files with low test coverage and generate comprehensive unit tests using AI"
author: "GUTAI Team"
branding:
  icon: "target"
  color: "green"

inputs:
  codecov-token:
    description: "Codecov API token for fetching coverage data"
    required: false
    default: ""
  github-token:
    description: "GitHub token for API access and PR creation"
    required: true
    default: ${{ github.token }}
  deepseek-token:
    description: "DeepSeek API token for AI test generation"
    required: false
    default: ""
  ai-provider:
    description: "AI provider to use for test generation (github or deepseek)"
    required: false
    default: "github"
  max-files:
    description: "Maximum number of files to process"
    required: false
    default: "3"
  target-coverage:
    description: "Only process files below this coverage percentage"
    required: false
    default: "80"
  languages:
    description: "Comma-separated list of languages to include (auto-detect if empty)"
    required: false
    default: ""
  exclude-patterns:
    description: "Comma-separated glob patterns to exclude"
    required: false
    default: "test*,spec*,*_test*,*_spec*,tests/*,spec/*"
  test-framework:
    description: "Preferred test framework (auto-detected if not specified)"
    required: false
    default: "auto"
  create-pr:
    description: "Whether to create a pull request with generated tests"
    required: false
    default: true
  pr-title:
    description: "Custom title for the pull request (auto-generated if not provided)"
    required: false
    default: ""
  branch:
    description: "The PR branch name"
    required: false
    default: "coverage-boost"
  ai-model:
    description: "GitHub Models AI model to use"
    required: false
    default: "openai/gpt-4.1"
  output-format:
    description: "Output format for test generation report"
    required: false
    default: "json"

outputs:
  files_processed:
    value: ${{ steps.streamer.outputs.files_processed }}
  tests_generated:
    value: ${{ steps.streamer.outputs.tests_generated }}
  coverage_report:
    value: ${{ steps.streamer.outputs.coverage_report }}
  pr_url:
    value: ${{ steps.check-pr.outputs.pr_url }}
  branch_name:
    value: ${{ steps.check-pr.outputs.branch_name }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install azure-ai-inference requests PyYAML

    - name: Check existing pull request
      id: check-pr
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        pr_url=$(gh pr list --state open --json url,headRefName --jq '.[] | select(.headRefName == "${{ inputs.branch }}") | .url' || true)
        echo pr_url is "$pr_url"
        if [ -n "$pr_url" ]; then
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT
          echo "branch_name=${{ inputs.branch }}" >> $GITHUB_OUTPUT
          echo "PR already exists, skipping test generation"
          exit 0 # Exit early if PR exists
        else
          echo "No existing PR found for branch '${{ inputs.branch }}'. Proceeding with test generation. create PR: ${{ inputs.create-pr }}"
          echo "pr_url=" >> $GITHUB_OUTPUT
          echo "branch_name=" >> $GITHUB_OUTPUT
        fi
    - name: Fetch coverage data
      id: coverage
      shell: bash
      if: steps.check-pr.outputs.pr_url == ''
      env:
        CODECOV_TOKEN: ${{ inputs.codecov-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python ${{ github.action_path }}/scripts/get_coverage_data.py \
          --org "${{ github.repository_owner }}" \
          --repo "${{ github.event.repository.name }}" \
          --branch "${{ github.ref_name }}" \
          --limit "${{ inputs.max-files }}" \
          --target-coverage "${{ inputs.target-coverage }}" \
          --exclude-patterns "${{ inputs.exclude-patterns }}" \
          --languages "${{ inputs.languages }}" \
          --output coverage_data.json

    - name: Generate tests using AI
      id: generate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DEEPSEEK_TOKEN: ${{ inputs.deepseek-token }}
      if: steps.check-pr.outputs.pr_url == ''
      run: |
        echo "Generating tests with AI provider: ${{ inputs.ai-provider }} and model: ${{ inputs.ai-model }}"
        if [ -f coverage_data.json ]; then
          python ${{ github.action_path }}/scripts/generate_tests.py \
            --coverage-data coverage_data.json \
            --max-files "${{ inputs.max-files }}" \
            --test-framework "${{ inputs.test-framework }}" \
            --ai-model "${{ inputs.ai-model }}" \
            --provider "${{ inputs.ai-provider }}" \
            --output-dir generated_tests \
            --output-format "${{ inputs.output-format }}"
        fi

    - name: Prepare pull request
      id: pr-info
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      if: ${{ steps.check-pr.outputs.pr_url == '' && inputs.create-pr == true}}
      run: |
        if [ -f coverage_data.json ] && [ -f generated_tests/summary.json ]; then
          python ${{ github.action_path }}/scripts/prepare_pr.py \
            --coverage-data coverage_data.json \
            --generated-tests generated_tests \
            --ai-model "${{ inputs.ai-model }}" \
            --ai-provider "${{ inputs.ai-provider }}" \
            --output-file pr_info.json

          commit_msg=$(python -c "import json; data=json.load(open('pr_info.json')); print(data.get('commit_message', 'AI Generated Tests'))")
          pr_title=$(python -c "import json; data=json.load(open('pr_info.json')); print(data.get('title', 'AI Generated Tests'))")
          pr_body=$(python -c "import json; data=json.load(open('pr_info.json')); print(data.get('description', ''))")

          git config --global user.name "GUTAI Action"
          git config --global user.email "actions-bot@users.noreply.github.com"
          git add .
          git commit -asm "$commit_msg"

          {
            echo "pr_title<<PRTITLE_EOF"
            echo "$pr_title"
            echo "PRTITLE_EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "pr_body<<PRBODY_EOF"
            echo "$pr_body"
            echo "PRBODY_EOF"
          } >> $GITHUB_OUTPUT
        else
          echo "No tests found, skipping PR preparation"
          echo "pr_title=''" >> $GITHUB_OUTPUT
        fi

    - name: Create pull request
      id: create-pr
      if: ${{ steps.check-pr.outputs.pr_url == '' && inputs.create-pr == true && steps.pr-info.outputs.pr_title != '' }}
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.github-token }}
        title: ${{ steps.pr-info.outputs.pr_title }}
        body: ${{steps.pr-info.outputs.pr_body}}
        branch: ${{ inputs.branch }}
        draft: true

    - name: Set outputs
      shell: bash
      id: streamer
      run: |
        if [ -f generated_tests/summary.json ]; then
          files_processed=$(python -c "import json; data=json.load(open('generated_tests/summary.json')); print(data.get('files_processed', 0))")
          tests_generated=$(python -c "import json; data=json.load(open('generated_tests/summary.json')); print(data.get('tests_generated', 0))")
          echo "files_processed=$files_processed" >> $GITHUB_OUTPUT
          echo "tests_generated=$tests_generated" >> $GITHUB_OUTPUT
        else
          echo "files_processed=0" >> $GITHUB_OUTPUT
          echo "tests_generated=0" >> $GITHUB_OUTPUT
        fi

        if [ -f coverage_data.json ]; then
          coverage_content=$(cat coverage_data.json | tr -d '\n' | sed 's/"/\\"/g')
          echo "coverage_report=$coverage_content" >> $GITHUB_OUTPUT
        else
          echo "coverage_report=" >> $GITHUB_OUTPUT
        fi
