name: Test Action

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

permissions:
  models: read
  contents: write
  pull-requests: write

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the action
        id: test
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          exclude-patterns: "tests/*,docs/*,examples/*"
          max-files: 2
          target-coverage: 50
          create-pr: true

      - name: Check outputs
        run: |
          echo "Files processed: ${{ steps.test.outputs.files_processed }}"
          echo "Tests generated: ${{ steps.test.outputs.tests_generated }}"
          echo "Coverage report: ${{ steps.test.outputs.coverage_report }}"
          echo "PR URL: ${{ steps.test.outputs.pr_url }}"
          echo "Branch name: ${{ steps.test.outputs.branch_name }}"

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-inference requests PyYAML

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/*.py
          echo "All scripts compiled successfully"

  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-inference requests PyYAML

      - name: Run unit tests
        run: |
          # Run tests with unittest discovery
          python -m unittest discover -s tests -p "test_*.py" -v
