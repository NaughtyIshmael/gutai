name: Test Action

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

permissions:
  models: read
  contents: write
  pull-requests: write

jobs:
  validate-configuration:
    runs-on: ubuntu-latest
    name: Validate Multi-Provider Configuration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Validate action configuration
        run: |
          python3 -c "
          import yaml
          with open('action.yml') as f:
              action = yaml.safe_load(f)

          inputs = action['inputs']

          # Validate required inputs exist
          required_inputs = ['github-token', 'deepseek-token', 'ai-provider']
          for inp in required_inputs:
              assert inp in inputs, f'Missing input: {inp}'
              print(f'✅ Input {inp}: {inputs[inp][\"description\"]}')

          # Validate ai-provider choices
          assert inputs['ai-provider']['default'] == 'github', 'ai-provider default should be github'
          print(f'✅ ai-provider default: {inputs[\"ai-provider\"][\"default\"]}')

          print('✅ All action inputs validated successfully')
          "

      - name: Check environment variables
        run: |
          echo "Checking required environment variables..."
          echo "GITHUB_TOKEN: ${GITHUB_TOKEN:+SET}"
          echo "DEEPSEEK_TOKEN: ${DEEPSEEK_TOKEN:+SET}"

          if [ -z "$GITHUB_TOKEN" ]; then
            echo "⚠️ GITHUB_TOKEN not set"
          else
            echo "✅ GITHUB_TOKEN is available"
          fi

          if [ -z "$DEEPSEEK_TOKEN" ]; then
            echo "⚠️ DEEPSEEK_TOKEN not set - DeepSeek tests may fail"
          else
            echo "✅ DEEPSEEK_TOKEN is available"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}

  test-action:
    runs-on: ubuntu-latest
    needs: validate-configuration
    strategy:
      matrix:
        provider: [github, deepseek]
      fail-fast: false
    name: Test Action (${{ matrix.provider }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test the action with ${{ matrix.provider }}
        id: test
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          deepseek-token: ${{ secrets.DEEPSEEK_TOKEN }}
          ai-provider: ${{ matrix.provider }}
          exclude-patterns: "tests/*,docs/*,examples/*"
          max-files: 2
          target-coverage: 50
          create-pr: false
          branch: coverage-boost-${{ matrix.provider }}-test

      - name: Check outputs for ${{ matrix.provider }}
        run: |
          echo "Provider: ${{ matrix.provider }}"
          echo "Files processed: ${{ steps.test.outputs.files_processed }}"
          echo "Tests generated: ${{ steps.test.outputs.tests_generated }}"
          echo "Coverage report: ${{ steps.test.outputs.coverage_report }}"
          echo "PR URL: ${{ steps.test.outputs.pr_url }}"
          echo "Branch name: ${{ steps.test.outputs.branch_name }}"

      - name: Validate provider-specific outputs
        run: |
          # Check that the action completed successfully
          if [ "${{ steps.test.outputs.files_processed }}" = "0" ]; then
            echo "⚠️ Warning: No files were processed for ${{ matrix.provider }}"
            exit 0
          else
            echo "✅ ${{ matrix.provider }} provider processed ${{ steps.test.outputs.files_processed }} files"
          fi

          # Check if PR was created (only if files were processed)
          if [ -n "${{ steps.test.outputs.pr_url }}" ]; then
            echo "✅ PR created successfully with ${{ matrix.provider }}: ${{ steps.test.outputs.pr_url }}"
          elif [ "${{ steps.test.outputs.files_processed }}" != "0" ]; then
            echo "⚠️ Warning: Files processed but no PR URL returned for ${{ matrix.provider }}"
          fi
          name: provider-comparison-report
          path: comparison.md

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-inference requests PyYAML

      - name: Validate Python scripts
        run: |
          python -m py_compile scripts/*.py
          echo "All scripts compiled successfully"

  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-inference requests PyYAML

      - name: Run unit tests
        run: |
          # Run tests with unittest discovery
          python -m unittest discover -s tests -p "test_*.py" -v
